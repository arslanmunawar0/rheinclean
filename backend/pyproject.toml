[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rheinclean-api"
version = "0.1.0"
description = "API for the fictional RheinClean Gebäudeservice demo website"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.128.0",
  "uvicorn==0.40.0",
  "sqlalchemy==2.0.44",
  "pydantic==2.12.3",
  "pydantic-settings==2.11.0",
  "email-validator==2.3.0",
  "itsdangerous==2.2.0",
  "argon2-cffi==25.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.1",
  "httpx==0.28.1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
